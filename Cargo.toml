[workspace]
resolver = "3"
members = [
    "crates/uncode-shared",
    "crates/uncode-ai",
    "crates/uncode-core",
    "crates/uncode-macros",
    "crates/uncode-extensions",
    "crates/uncode-agent",
    "crates/uncode-tui",
    "crates/uncode-rpc",
    "crates/uncode-platform",
    "crates/uncode-cli",
]
default-members = ["crates/uncode-cli"]

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "warn"

[workspace.lints.clippy]
enum_variant_names = "allow"
new_without_default = "warn"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT"
repository = "https://github.com/FDE-GROUP/uncode"
authors = ["EA Team"]

[workspace.dependencies]
# ── Async ──
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tokio-util = "0.7"
futures = "0.3"
async-trait = "0.1"

# ── Serialization ──
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# ── Error handling ──
anyhow = "1"
thiserror = "2"

# ── Logging ──
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# ── HTTP / SSE ──
reqwest = { version = "0.12", default-features = false, features = [
    "json", "stream", "rustls-tls", "gzip", "deflate", "brotli",
] }
eventsource-stream = "0.2"
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["cors", "fs"] }

# ── CLI ──
clap = { version = "4", features = ["derive"] }
clap_complete = "4"

# ── TUI ──
ratatui = "0.30"
crossterm = "0.28"

# ── Database ──
surrealdb = { version = "3.0", features = ["kv-rocksdb", "kv-mem"] }

# ── Time ──
chrono = { version = "0.4", features = ["serde"] }

# ── IDs ──
uuid = { version = "1", features = ["v4", "v7", "serde"] }

# ── Diff ──
similar = { version = "2", features = ["text"] }

# ── System ──
libc = "0.2"

# ── Crypto ──
sha2 = "0.10"

# ── Concurrency ──
dashmap = "6"
parking_lot = "0.12"

# ── Misc ──
dirs = "6"
schemars = "1"
regex = "1"
glob = "0.3"
walkdir = "2"
ignore = "0.4"
unicode-width = "0.2"
unicode-segmentation = "1"

# ── Code parsing ──
syntect = "5"

# ── HTML ──
html2text = "0.14"

# ── Markdown ──
markdown = "1.0"

# ── Proc macros ──
syn = "2"
quote = "1"
proc-macro2 = "1"

# ── WASM ──
wasmtime = { version = "29", default-features = false, features = [
    "cranelift", "parallel-compilation", "runtime",
] }

# ── Internal crates ──
uncode-shared = { path = "crates/uncode-shared" }
uncode-ai = { path = "crates/uncode-ai" }
uncode-core = { path = "crates/uncode-core" }
uncode-macros = { path = "crates/uncode-macros" }
uncode-extensions = { path = "crates/uncode-extensions" }
uncode-agent = { path = "crates/uncode-agent" }
uncode-tui = { path = "crates/uncode-tui" }
uncode-rpc = { path = "crates/uncode-rpc" }
uncode-cli = { path = "crates/uncode-cli" }

[profile.dev]
debug = "line-tables-only"
opt-level = 1

[profile.dev.package."*"]
debug = false
opt-level = 0

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
strip = true
